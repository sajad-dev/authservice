  authorization:
    build:
      context: ./authentication
      dockerfile: Dockerfile
    env_file:
      - ./authentication/.env
    container_name: authentication_service
    networks:
      - app_network
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - db
