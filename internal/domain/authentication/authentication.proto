syntax = "proto3";

package authenticationproto;

option go_package = "/internal/domain/authentication/authenticationproto";

service Authtication {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
}

message User {
  string username = 1;
  string email = 2;
  string first_name = 4;
  string last_name =5;
  repeated string two_factor = 6;
}

message LoginResponse {
  int32 code = 1;
  string msg = 2;
  User data = 3;
  string token = 4;

}
message LoginRequest {
      string username = 1;
      string password = 2;
}


message RegisterResponse {
    int32 code = 1;
    string msg = 2;
    User data = 3;
    string token = 4;

}
message RegisterRequest {
  string first_name =1 ;
  string last_name= 2 ;
  string username =3 ;
  string email =4 ;
  string password =5 ;
  string password_confirmation = 6;
  string remember =7 ;
}
