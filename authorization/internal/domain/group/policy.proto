syntax = "proto3";

package policyproto;

option go_package = "/internal/domain/policy/policyproto";

service Policy {
  rpc Create (CreateRequest) returns (Response);
  rpc Delete (DeleteRequest) returns (Response);
  rpc GetAll () returns (GetAllResponse);
}

message Response {
  int32 code = 1;
  string message = 2;
}
message repeated_string {
    repeated string strings = 1;
}
message Response {
  int32 code = 1;
  string message = 2;
  reapeted repeated_string data = 3 ;
}

message CreateRequest {
      string subject = 1;
      string group = 2;
      string action = 3;
}

message DeleteRequest {
      string subject = 1;
      string group = 2;
      string action = 3;
}

